overview_cards:
  - kicker: Mission
    title: Built to strengthen the compensation and rewards community in the Carolinas.
    paragraphs:
      - Carolina Compensation and Rewards Association is a 501(c)(3) nonprofit professional association dedicated to strengthening the compensation and rewards community across North and South Carolina through accessible professional development, community-centered networking, and a future-focused talent pipeline.

programs:
  kicker: Connect with CCRA
  title: Membership and events are managed through WildApricot.
  items:
    - title: Membership
      description: Join compensation and total rewards professionals across the Carolinas for shared learning, peer connection, and professional community.
      action_label: Join Us
      action_key: membership
    - title: Events
      description: Explore CCRA professional development and networking opportunities, with current details and registration available through WildApricot.
      action_label: View Events
      action_key: events

audience:
  kicker: Who this is for
  title: A home for compensation and total rewards professionals at multiple career stages.
  items:
    - Practitioners leading compensation, rewards, and benefits programs
    - HR and people leaders working closely with total rewards strategy
    - Consultants, analysts, and specialists supporting pay and rewards decisions
    - Early-career professionals and students exploring the field

